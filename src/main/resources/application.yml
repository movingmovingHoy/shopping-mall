spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: shop
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      # schema.sql/data.sql을 읽을 인코딩. 지정하지 않으면 JVM 기본값(Windows 한글판은 MS949)으로 읽어서
      # UTF-8로 저장된 data.sql의 한글이 깨진 채로 DB에 들어간다.
      encoding: UTF-8

server:
  servlet:
    session:
      timeout: 30m

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.shop: debug
