spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shop_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: shop
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      encoding: UTF-8   # main의 application.yml 주석 참고 (data.sql 한글 깨짐 방지)

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.shop: debug
